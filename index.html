<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bússola — Organização financeira</title>
  <meta name="description" content="Bússola: organização financeira pessoal feita à mão, com orçamento por categoria, contas fixas e projeção de fechamento do mês.">
  <meta name="theme-color" content="#5b5b69">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    /* aplica o tema antes da primeira pintura (evita piscar) */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('bussola.settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/inicio" aria-label="Bússola — início">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="47" fill="#5b5b69"/>
          <path d="M12 38A40 40 0 0 1 38 12" stroke="#767687" stroke-width="5" stroke-linecap="round" fill="none"/>
          <circle cx="50" cy="50" r="37" fill="#eaf0fa"/>
          <g fill="#3a3a46"><rect x="47" y="14" width="6" height="9" rx="3"/><rect x="47" y="77" width="6" height="9" rx="3"/><rect x="14" y="47" width="9" height="6" rx="3"/><rect x="77" y="47" width="9" height="6" rx="3"/></g>
          <path d="M50 27v46M27 50h46" stroke="#a9bcd6" stroke-width="5" stroke-linecap="round"/>
          <g class="needle">
            <path d="M50 12 59 50H41Z" fill="#f0524f"/><path d="M50 12 59 50H50Z" fill="#d9403f"/>
            <path d="M50 88 41 50H59Z" fill="#6db6e8"/><path d="M50 88 41 50H50Z" fill="#4a9bd9"/>
            <circle cx="50" cy="50" r="7" fill="#3a3a46"/><circle cx="48" cy="48" r="2" fill="#6a6a7c"/>
          </g>
        </svg>
        <span class="brand-name">Bússola</span>
      </a>
      <nav class="nav" id="nav" aria-label="Principal"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="main">
      <header class="top">
        <h1 id="pageTitle">Início</h1>
        <div class="top-tools">
          <div class="month" id="month" role="group" aria-label="Mês">
            <button class="icon-btn" data-act="month-prev" aria-label="Mês anterior"></button>
            <span class="month-label" id="monthLabel" aria-live="polite"></span>
            <button class="icon-btn" data-act="month-next" aria-label="Próximo mês"></button>
          </div>
          <button class="acc-btn" id="accBtn" data-act="acc" aria-label="Conta"></button>
          <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Alternar tema"></button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <button class="fab" id="fab" data-act="tx-new" aria-label="Novo lançamento"></button>
  <dialog id="dlg" class="dlg"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">A Bússola precisa de JavaScript para funcionar.</p></noscript>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/version.js"></script>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/updater.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
